<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="#inicio" class="logo">Mi Portafolio</a>
            <ul class="nav-menu">
                <li><a href="#inicio" class="nav-link active">INICIO</a></li>
                <li><a href="#proyectos" class="nav-link">PROYECTOS</a></li>
                <li><a href="#certificados" class="nav-link">CERTIFICADOS</a></li>
            </ul>
            <div class="social-menu">
                <a href="#" aria-label="GitHub"><i class="fab fa-github"></i></a>
                <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
                <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            </div>
        </nav>
    </header>
    <main>
        <section id="inicio">
            <div class="profile-container">
                <img src="img/perfil.jpg" alt="Mi Foto" class="profile-image">
                <h1 class="profile-name" id="profile-name"></h1>
                <p class="profile-career" id="profile-career"></p>
                <p class="profile-university" id="profile-university"></p>
            </div>
            <div class="intro-container">
                <p class="intro-small">PORTAFOLIO PROFESIONAL</p>
                <h2 class="intro-title">Hola, soy <span id="profile-short-name"></span></h2>
                <p class="intro-text" id="profile-description"></p>
            </div>
        </section>
        <section id="proyectos">
            <h2 class="section-title">Mis <span>proyectos</span></h2>
            <p class="section-description">Proyectos académicos y profesionales.</p>
            <div class="projects-grid" id="projects-container"></div>
        </section>
        <section id="certificados">
            <h2 class="section-title">Mis <span>certificados</span></h2>
            <p class="section-description">Formación complementaria y certificaciones.</p>
            <div class="certificates-grid" id="certificates-container"></div>
        </section>
    </main>
    <footer>
        © <span id="year"></span> Mi Portafolio. Todos los derechos reservados.
    </footer>
    <script type="application/json" id="portfolio-data"></script>
    <script src="script.js"></script>
</body>
</html>
